<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线JSON和URL Query参数互转工具，支持对象转查询字符串、查询字符串转JSON、数组参数格式控制，数据仅在浏览器本地处理。">
    <meta name="keywords" content="JSON转Query,Query转JSON,URL参数转换,查询字符串,Query String">
    <title>JSON和Query参数互转工具 - 在线 URL 参数转换</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>JSON Query互转</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="url-parser.html">URL解析</a>
            <a href="json-format.html">JSON</a>
            <a href="crypto.html">URL编码</a>
            <a href="properties-convert.html">Properties</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
            <a href="https://gitee.com/rodert/jsonformat" target="_blank" rel="noopener">Gitee</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">数据格式类工具</p>
                <h1>JSON和Query参数互转</h1>
                <p>将 JSON 对象转换为 URL 查询字符串，也可以把 Query 参数解析为格式化 JSON，适合接口调试和链接参数整理。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>输入内容</h2>
                    <textarea id="query-input" class="utility-textarea" spellcheck="false" placeholder='输入 JSON：{"page":1,"tag":["js","tools"]}，或输入 Query：page=1&tag=js&tag=tools'></textarea>
                    <div class="option-row">
                        <label for="query-array-format">数组格式</label>
                        <select id="query-array-format">
                            <option value="repeat">重复 key：a=1&a=2</option>
                            <option value="brackets">方括号：a[]=1&a[]=2</option>
                            <option value="comma">逗号：a=1,2</option>
                        </select>
                        <label><input id="query-leading-question" type="checkbox"> 输出带 ?</label>
                    </div>
                    <div class="button-group compact">
                        <button id="json-to-query-btn" class="primary">JSON转Query</button>
                        <button id="query-to-json-btn" class="secondary">Query转JSON</button>
                        <button id="query-sample-btn" class="secondary">示例</button>
                        <button id="query-clear-btn" class="secondary">清空</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <h2>转换结果</h2>
                    <textarea id="query-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
                    <div class="button-group compact">
                        <button id="query-copy-btn" class="secondary">复制结果</button>
                        <button id="query-swap-btn" class="secondary">结果放回输入</button>
                    </div>
                </article>
            </div>
            <div id="query-message" class="json-message">等待输入内容。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>对象会按点号展开嵌套字段，例如 `user.name=JavaPub`，重复参数会解析为数组。</p>
        </div>
        <div class="footer-links">
            <a href="url-parser.html">URL地址解析</a>
            <a href="json-format.html">JSON格式化</a>
            <a href="crypto.html">URL编码解码</a>
        </div>
    </footer>

    <script src="js/query-string.js"></script>
</body>
</html>
