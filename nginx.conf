server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
