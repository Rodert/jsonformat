<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线HTTP请求方法查询工具，查询GET、POST、PUT、PATCH、DELETE、HEAD、OPTIONS等方法的语义、幂等性和使用场景。">
    <meta name="keywords" content="HTTP请求方法,GET,POST,PUT,PATCH,DELETE,幂等性,安全方法">
    <title>HTTP请求方法查询工具 - GET POST PUT DELETE 方法说明</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>HTTP请求方法</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="http-status.html">HTTP状态码</a>
            <a href="http-header.html">HTTP Header</a>
            <a href="api-error.html">API错误码</a>
            <a href="url-parser.html">URL解析</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
            <a href="https://gitee.com/rodert/jsonformat" target="_blank" rel="noopener">Gitee</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">开发调试类工具</p>
                <h1>HTTP请求方法查询</h1>
                <p>查询常见 HTTP 方法的语义、是否安全、是否幂等、是否常带请求体以及典型使用场景。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <article class="utility-panel wide-panel">
                <h2>搜索请求方法</h2>
                <div class="option-row">
                    <label for="method-search">关键词</label>
                    <input id="method-search" type="text" placeholder="例如：GET、幂等、更新、预检">
                    <button id="method-clear-btn" class="secondary" type="button">清空</button>
                </div>
                <textarea id="method-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
            </article>
            <div id="method-message" class="json-message">输入方法名、特性或场景查询。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>安全方法表示语义上不修改服务器状态；幂等方法表示重复执行多次的最终效果相同。</p>
        </div>
        <div class="footer-links">
            <a href="http-status.html">HTTP状态码</a>
            <a href="http-header.html">HTTP Header查询</a>
            <a href="url-parser.html">URL地址解析</a>
        </div>
    </footer>

    <script src="js/http-method.js"></script>
</body>
</html>
