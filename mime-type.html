<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线MIME Type查询工具，按文件扩展名、Content-Type、文件类型快速查询常见MIME类型，数据仅在浏览器本地处理。">
    <meta name="keywords" content="MIME Type查询,Content-Type,文件类型,扩展名,MIME类型">
    <title>MIME Type查询工具 - 常见Content-Type和文件扩展名</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>MIME Type查询</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="http-status.html">HTTP状态码</a>
            <a href="port-lookup.html">常用端口</a>
            <a href="file-size.html">文件大小</a>
            <a href="url-parser.html">URL解析</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
            <a href="https://gitee.com/rodert/jsonformat" target="_blank" rel="noopener">Gitee</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">开发调试类工具</p>
                <h1>MIME Type查询</h1>
                <p>按扩展名、Content-Type 或文件类型查询常见 MIME 类型，辅助上传、下载、响应头和对象存储配置。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <article class="utility-panel wide-panel">
                <h2>搜索 MIME 类型</h2>
                <div class="option-row">
                    <label for="mime-search">关键词</label>
                    <input id="mime-search" type="text" placeholder="例如：json、.png、application、font">
                    <button id="mime-clear-btn" class="secondary" type="button">清空</button>
                </div>
                <textarea id="mime-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
            </article>
            <div id="mime-message" class="json-message">输入关键词查询常见 MIME Type。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>内置常见 Web、文档、压缩包、字体、音视频和图片类型，适合日常调试查询。</p>
        </div>
        <div class="footer-links">
            <a href="http-status.html">HTTP状态码</a>
            <a href="port-lookup.html">常用端口</a>
            <a href="file-size.html">文件大小换算</a>
        </div>
    </footer>

    <script src="js/mime-type.js"></script>
</body>
</html>
