<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线JavaScript字符串转义和反转义工具，支持引号、反斜杠、换行、Unicode转义，数据仅在浏览器本地处理。">
    <meta name="keywords" content="JavaScript转义,JS字符串转义,字符串反转义,Unicode转义,escape unescape">
    <title>JavaScript字符串转义工具 - 在线JS Escape和Unescape</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>JS字符串转义</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="html-entity.html">HTML实体</a>
            <a href="unicode.html">Unicode</a>
            <a href="hex-text.html">Hex文本</a>
            <a href="regex.html">正则测试</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">编码加密类工具</p>
                <h1>JavaScript字符串转义</h1>
                <p>将普通文本转换为可放入 JavaScript 字符串字面量的转义形式，也可以把转义字符串还原为原始文本。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>输入内容</h2>
                    <textarea id="js-escape-input" class="utility-textarea" spellcheck="false" placeholder="输入普通文本或包含 \\n、\\u4e2d 的转义字符串..."></textarea>
                    <div class="option-row">
                        <label for="js-quote-mode">引号类型</label>
                        <select id="js-quote-mode">
                            <option value="double">双引号</option>
                            <option value="single">单引号</option>
                        </select>
                        <label><input id="js-use-unicode" type="checkbox"> 非ASCII转Unicode</label>
                    </div>
                    <div class="button-group compact">
                        <button id="js-escape-btn" class="primary">转义</button>
                        <button id="js-unescape-btn" class="secondary">反转义</button>
                        <button id="js-escape-sample-btn" class="secondary">示例</button>
                        <button id="js-escape-clear-btn" class="secondary">清空</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <h2>转换结果</h2>
                    <textarea id="js-escape-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
                    <div class="button-group compact">
                        <button id="js-escape-copy-btn" class="secondary">复制结果</button>
                        <button id="js-escape-swap-btn" class="secondary">结果放回输入</button>
                    </div>
                </article>
            </div>
            <div id="js-escape-message" class="json-message">等待输入内容。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>适合处理日志文本、模板字符串片段、JSON 内嵌字符串和前端测试数据。</p>
        </div>
        <div class="footer-links">
            <a href="html-entity.html">HTML实体转义</a>
            <a href="unicode.html">Unicode编码</a>
            <a href="hex-text.html">Hex文本互转</a>
        </div>
    </footer>

    <script src="js/js-escape.js"></script>
</body>
</html>
