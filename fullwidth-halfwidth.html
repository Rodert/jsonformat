<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线全角半角转换工具，支持中文标点、英文字母、数字、空格在全角和半角之间互转，数据仅在浏览器本地处理。">
    <meta name="keywords" content="全角半角转换,全角转半角,半角转全角,中文标点转换,字符转换">
    <title>全角半角转换工具 - 在线全角转半角和半角转全角</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>全角半角转换</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="case-convert.html">大小写</a>
            <a href="unicode.html">Unicode</a>
            <a href="text-sort.html">文本排序</a>
            <a href="html-entity.html">HTML实体</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">文本处理类工具</p>
                <h1>全角半角转换</h1>
                <p>将全角英文字母、数字、空格和常用中文标点转换为半角，也可以反向把半角内容转换为全角。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>输入文本</h2>
                    <textarea id="fullwidth-input" class="utility-textarea" spellcheck="false" placeholder="输入需要转换的文本，例如：ＪａｖａＰｕｂ，１２３！"></textarea>
                    <div class="option-row">
                        <label><input id="convert-punctuation" type="checkbox" checked> 转换常用标点</label>
                    </div>
                    <div class="button-group compact">
                        <button id="to-halfwidth-btn" class="primary">全角转半角</button>
                        <button id="to-fullwidth-btn" class="secondary">半角转全角</button>
                        <button id="fullwidth-sample-btn" class="secondary">示例</button>
                        <button id="fullwidth-clear-btn" class="secondary">清空</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <h2>转换结果</h2>
                    <textarea id="fullwidth-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
                    <div class="button-group compact">
                        <button id="fullwidth-copy-btn" class="secondary">复制结果</button>
                        <button id="fullwidth-swap-btn" class="secondary">结果放回输入</button>
                    </div>
                </article>
            </div>
            <div id="fullwidth-message" class="json-message">等待输入文本。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>适合清洗从表格、文档、日志中复制出的混合全角字符。</p>
        </div>
        <div class="footer-links">
            <a href="case-convert.html">大小写转换</a>
            <a href="text-sort.html">文本排序</a>
            <a href="unicode.html">Unicode编码</a>
        </div>
    </footer>

    <script src="js/fullwidth-halfwidth.js"></script>
</body>
</html>
