<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线随机密码生成器，支持长度、批量、大小写字母、数字、符号和排除易混字符，使用浏览器安全随机数生成。">
    <meta name="keywords" content="随机密码生成器,密码生成,安全密码,批量密码,强密码生成">
    <title>随机密码生成器 - 在线批量生成安全密码</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">JP</span>
            <span>
                <strong>JavaPub Tools</strong>
                <small>随机密码生成</small>
            </span>
        </a>
        <nav class="top-nav" aria-label="主导航">
            <a href="index.html">首页</a>
            <a href="random-number.html">随机数</a>
            <a href="uuid.html">UUID</a>
            <a href="crypto.html">编码加密</a>
            <a href="checksum.html">CRC校验</a>
            <a href="https://github.com/Rodert/jsonformat" target="_blank" rel="noopener">GitHub</a>
            <a href="https://gitee.com/rodert/jsonformat" target="_blank" rel="noopener">Gitee</a>
        </nav>
    </header>

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">生成类工具</p>
                <h1>随机密码生成器</h1>
                <p>使用浏览器 Crypto API 生成随机密码，支持批量输出和字符集控制，适合临时账号、测试环境和密钥占位。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
        </section>

        <section class="utility-workbench">
            <div class="utility-grid two-column">
                <article class="utility-panel">
                    <h2>生成选项</h2>
                    <div class="option-row">
                        <label for="password-length">长度</label>
                        <input id="password-length" type="number" min="4" max="256" value="16">
                        <label for="password-count">数量</label>
                        <input id="password-count" type="number" min="1" max="200" value="10">
                    </div>
                    <div class="option-row">
                        <label><input id="password-uppercase" type="checkbox" checked> 大写字母</label>
                        <label><input id="password-lowercase" type="checkbox" checked> 小写字母</label>
                        <label><input id="password-digits" type="checkbox" checked> 数字</label>
                        <label><input id="password-symbols" type="checkbox" checked> 符号</label>
                    </div>
                    <div class="option-row">
                        <label><input id="password-avoid-ambiguous" type="checkbox" checked> 排除易混字符</label>
                        <label><input id="password-require-each" type="checkbox" checked> 每类至少一个</label>
                    </div>
                    <div class="button-group compact">
                        <button id="password-generate-btn" class="primary">生成</button>
                        <button id="password-clear-btn" class="secondary">清空</button>
                    </div>
                </article>

                <article class="utility-panel">
                    <h2>生成结果</h2>
                    <textarea id="password-output" class="utility-textarea output" spellcheck="false" readonly></textarea>
                    <div class="button-group compact">
                        <button id="password-copy-btn" class="secondary">复制结果</button>
                    </div>
                </article>
            </div>
            <div id="password-message" class="json-message">等待生成密码。</div>
        </section>
    </main>

    <footer class="site-footer">
        <div>
            <strong>作者：王仕宇 / JavaPub</strong>
            <p>随机数来自 `crypto.getRandomValues`，比 `Math.random` 更适合生成密码类内容。</p>
        </div>
        <div class="footer-links">
            <a href="random-number.html">随机数生成</a>
            <a href="uuid.html">UUID生成</a>
            <a href="crypto.html">加密工具</a>
        </div>
    </footer>

    <script src="js/random-password.js"></script>
</body>
</html>
