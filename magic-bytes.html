    <title>Magic Bytes文件头查询工具 - 常见文件格式签名</title>

<body class="tool-page">
    <header class="site-header">
        <a href="index.html" class="brand">

    <main class="tool-shell">
        <section class="tool-hero">
            <div>
                <p class="eyebrow">开发调试类工具</p>
                <h1>Magic Bytes文件头查询</h1>
                <p>查询常见文件格式的十六进制文件头签名，辅助识别真实文件类型和排查上传内容。</p>
            </div>
            <strong>数据仅在浏览器本地处理，不上传服务器。</strong>
